<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工业过程组态仿真 · 水系统</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef3;color:#1b3144;font:15px/1.5 'Microsoft YaHei',Arial,sans-serif}header{background:#163247;color:white;padding:20px 4%;display:flex;justify-content:space-between;align-items:center;gap:14px}header h1{margin:0;font-size:25px}header small{color:#c4dce9}.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;background:#24465a;border-radius:6px;font-size:13px}.dot{width:8px;height:8px;background:#48dba2;border-radius:50%;display:inline-block}.wrapper{max-width:1320px;margin:auto;padding:22px 26px}.nav{display:flex;gap:10px;margin-bottom:18px}.nav button{border:0;padding:12px 24px;border-radius:8px;color:#315065;background:#d6e1ea;font:inherit;font-weight:700;cursor:pointer}.nav button.selected{background:#186f91;color:white}.panel{background:#fff;border:1px solid #c9d6df;border-radius:12px;box-shadow:0 8px 25px #143b5510;overflow:hidden}.toolbar{display:flex;gap:8px;align-items:center;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid #dce4ea;background:#f7fafb}.control{border:1px solid #bdd0dd;color:#234b62;background:#fff;border-radius:7px;padding:9px 14px;font:inherit;cursor:pointer}.control.active{background:#087b89;color:white;border-color:#087b89}.control:hover{filter:brightness(.96)}.danger{color:#a13736}.toolbar .spacer{flex:1}.scene{display:block;width:100%;height:auto;background:#f6f9fb}.scene text{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#294759}.flow{fill:none;stroke:#99adba;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.flow.on{stroke:#13b6d5;stroke-dasharray:15 12;animation:flow 1s linear infinite}.flow.chem.on{stroke:#e9bd28}.shell{fill:#dbe5eb;stroke:#6d8799;stroke-width:2}.water{fill:url(#water);transition:all .25s}.valvebody{fill:#9aabb5;stroke:#5b7483;stroke-width:2}.valvebody.on{fill:#1fb981}.rotor{transform-origin:0 0}.rotor.on{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-54}}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;padding:14px 18px;border-top:1px solid #dce4ea;background:#f4f8fa}.metric{background:#fff;border:1px solid #dce4ea;border-radius:8px;padding:12px 14px}.metric small{color:#617d8d}.metric strong{display:block;font-size:24px;color:#174c65}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{border:1px solid #cbd9e2;background:white;padding:15px 18px;border-radius:10px}.card h3{margin:0 0 10px}.log{height:98px;overflow:auto;font:13px/1.6 Consolas,'Microsoft YaHei',sans-serif;color:#3a6174}.note{margin-top:12px;color:#667e8e;font-size:12px}label input{width:128px;border:1px solid #c9d5df;border-radius:5px;padding:6px}.student{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}@media(max-width:750px){.bottom{grid-template-columns:1fr}.wrapper{padding:10px}.nav button{padding:10px}.toolbar{gap:5px}.control{padding:6px 8px}header{padding:12px}}
</style></head><body><header><div><small>工业自动化 · 课程设计 / PROCESS CONTROL</small><h1>水系统联合组态仿真</h1></div><span class="chip"><i class="dot"></i> 本地演示 · 500 ms 周期</span></header><main class="wrapper">
<div class="student"><label>姓名 <input placeholder="填写姓名"></label><label>班级 <input placeholder="填写班级"></label><label>学号 <input placeholder="填写学号"></label></div>
<div class="nav"><button id="tab1" class="selected">01 水力驱动搅拌机</button><button id="tab2">02 多功能水库应用</button></div>
<div class="panel"><div class="toolbar" id="controls"></div><svg id="diagram" class="scene" viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg"></svg><div class="metrics" id="metrics"></div></div>
<div class="bottom"><div class="card"><h3>控制要求</h3><div id="requirements"></div></div><div class="card"><h3>仿真运行记录</h3><div id="log" class="log"></div></div></div>
<div class="note">本文件为离线组态教学仿真，逻辑对应所提供的 SCL 源程序与变量表；不代表已经完成 WinCC Runtime 或 PLCSIM 联调。</div></main>
<script src="WaterModel.js"></script><script>
const $=id=>document.getElementById(id), M=WaterModel;
let mixer=M.freshMixer(), reservoir=M.freshReservoir(), tab=1, running=true, ticks=0;
const defs=`<defs><linearGradient id="metal" x1="0" x2="1"><stop stop-color="#849cac"/><stop offset=".44" stop-color="#f4f8fa"/><stop offset="1" stop-color="#839baa"/></linearGradient><linearGradient id="water" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#63d8e6"/><stop offset="1" stop-color="#087ca8"/></linearGradient><linearGradient id="field" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8ac4e9"/><stop offset=".5" stop-color="#bee5c6"/><stop offset=".51" stop-color="#6eaf58"/><stop offset="1" stop-color="#3a803f"/></linearGradient></defs>`;
const txt=(x,y,t,size=16,weight=500,anchor='middle')=>`<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}">${t}</text>`;
const pipe=(d,on,chem=false)=>`<path d="${d}" class="flow ${on?'on':''} ${chem?'chem':''}"/>`;
function pump(x,y,on){return `<g transform="translate(${x} ${y})"><rect x="-30" y="-22" width="60" height="44" rx="12" fill="url(#metal)" stroke="#567487" stroke-width="2"/><circle r="15" fill="${on?'#2ecb96':'#c9d6df'}" stroke="#54788a" stroke-width="2"/><path d="M-6 -7L9 0L-6 7Z" fill="#25617b"/><rect x="-23" y="24" width="46" height="8" rx="2" fill="#6a8697"/>${txt(0,60,'泵 1',16,700)}</g>`;}
function valve(x,y,on,label){return `<g transform="translate(${x} ${y})"><path d="M-19 -12L0 0L-19 12ZM19 -12L0 0L19 12Z" class="valvebody ${on?'on':''}"/><path d="M0 -2V-28" stroke="#58798c" stroke-width="5"/><rect x="-19" y="-32" width="38" height="7" rx="3" fill="${on?'#1eb783':'#a3b2bd'}"/>${txt(0,-43,label,15,700)}</g>`;}
function tank(x,y,w,h,value,max,name){const rim=14,fill=(h-16)*value/max,uid='t'+x+'_'+y;return `<g transform="translate(${x} ${y})"><rect x="0" y="${rim}" width="${w}" height="${h}" fill="url(#metal)" stroke="#6a8797" stroke-width="2"/><ellipse cx="${w/2}" cy="${rim}" rx="${w/2}" ry="${rim}" fill="#b9c9d3" stroke="#6a8797" stroke-width="2"/><ellipse cx="${w/2}" cy="${h+rim}" rx="${w/2}" ry="${rim}" fill="#7896a8" stroke="#6a8797" stroke-width="2"/><clipPath id="${uid}"><rect x="12" y="${rim+8}" width="${w-24}" height="${h-16}" rx="6"/></clipPath><rect x="12" y="${rim+8}" width="${w-24}" height="${h-16}" rx="6" fill="#edf6f8" stroke="#8ba8b9"/><rect class="water" x="12" y="${rim+8+h-16-fill}" width="${w-24}" height="${fill}" clip-path="url(#${uid})"/>${txt(w/2,h/2+24,`${value} / ${max}`,18,700)}${txt(w/2,h+rim+40,name,16,700)}</g>`;}
function gauge(x,y,v,max){const a=-135+270*v/max;return `<g transform="translate(${x} ${y})"><circle r="62" fill="white" stroke="#90a5b3" stroke-width="4"/><path d="M-40 40A56 56 0 1 1 40 40" fill="none" stroke="#d1dce3" stroke-width="9"/><path d="M-40 40A56 56 0 0 1 26 -49" fill="none" stroke="#2aba8c" stroke-width="9"/>${[0,.25,.5,.75,1].map(k=>{let b=(-135+270*k)*Math.PI/180;return `<line x1="${44*Math.sin(b)}" y1="${-44*Math.cos(b)}" x2="${51*Math.sin(b)}" y2="${-51*Math.cos(b)}" stroke="#455e6d" stroke-width="2"/>`}).join('')}<g transform="rotate(${a})"><path d="M-4 5L0 -44L4 5Z" fill="#dd6350"/></g><circle r="6" fill="#445f70"/>${txt(0,29,v,20,700)}${txt(0,82,'水量仪表',14,700)}</g>`;}
function mixerSvg(s){return `${defs}${txt(35,40,'工艺一 / 注水 · 转输 · 搅拌',23,700,'start')}<path d="M60 350H1040" stroke="#d6e1e8" stroke-width="2"/>${pipe('M150 225H265',s.pump&&s.tank<150)}${pipe('M405 220H480V146H610V190',s.valve&&s.tank>0&&s.pond<150)}${pipe('M830 190H945V300',s.mixer)}${pump(110,225,s.pump&&s.tank<150)}${tank(265,165,140,135,s.tank,150,'液罐')}${valve(520,146,s.valve,'阀门 1')}${tank(610,160,220,137,s.pond,150,'蓄水池')}${gauge(725,407,s.pond,150)}<g transform="translate(945 310)"><path d="M0 -12V-47" stroke="#5f7a8c" stroke-width="7"/><g class="rotor ${s.mixer?'on':''}"><circle r="9" fill="#46687b"/>${[0,60,120,180,240,300].map(a=>`<ellipse cx="30" cy="0" rx="28" ry="9" fill="${s.mixer?'#1ba6ad':'#a4bbc7'}" stroke="#5b8691" transform="rotate(${a})"/>`).join('')}</g>${txt(0,75,s.mixer?'搅拌运行':'搅拌停止',16,700)}</g>${txt(350,104,'每周期 +15',14)}${txt(524,205,'每周期转输 10',14)}${txt(939,124,'≥ 120 自动启动',15,700)}`;}
function reservoirSvg(s){const x=845+s.position*13;return `${defs}${txt(35,40,'工艺二 / 供水 · 灌溉 · 混合 · 装车',23,700,'start')}${pipe('M135 212H270V173',s.pump&&s.level<120)}${pipe('M405 173V90H850',s.v1&&s.level>0)}${pipe('M445 242H840',s.v2&&s.level>0&&s.chemical<100)}${pipe('M445 292H500V385H830',s.v3&&s.level>0&&s.truck<50)}${pipe('M690 183H840',s.v2&&s.level>0&&s.chemical<100,true)}${pump(100,212,s.pump&&s.level<120)}${tank(270,160,175,145,s.level,120,'主水库')}${gauge(356,415,s.level,120)}${valve(620,90,s.v1,'阀门 1')}${valve(620,242,s.v2,'阀门 2')}${valve(620,385,s.v3,'阀门 3')}<g><rect x="850" y="55" width="188" height="82" rx="8" fill="url(#field)" stroke="#6c9d6c"/><path d="M860 125L900 95L930 115L975 77L1030 120" stroke="#f5f7dd" opacity=".8" stroke-width="2" fill="none"/>${txt(944,153,'草原灌溉',14,700)}</g><g><rect x="655" y="165" width="72" height="35" rx="12" fill="#f5de5b" stroke="#b69933"/>${txt(691,187,'药液',13,700)}</g>${tank(840,184,115,108,s.chemical,100,'混合反应罐')}<g transform="translate(${x} 387)" style="transition:transform .4s"><rect x="0" y="-4" width="100" height="46" rx="5" fill="#748c9c"/><rect x="5" y="0" width="78" height="36" rx="10" fill="#e3eef4" stroke="#507c94"/><rect x="8" y="${3+30*(1-s.truck/50)}" width="72" height="${30*s.truck/50}" fill="#20b4d0" rx="2"/><rect x="90" y="7" width="32" height="35" rx="4" fill="#239baf"/><rect x="99" y="10" width="19" height="14" fill="#cce6ed"/><circle cx="23" cy="44" r="9" fill="#34495a"/><circle cx="101" cy="44" r="9" fill="#34495a"/>${txt(60,70,`${s.truck}/50`,15,700)}</g>${txt(920,362,'液罐车 · 满载自动离开',15,700)}${txt(194,192,'+20/周期',14)}`;}
function addLog(msg){let d=document.createElement('div');d.textContent=`[${(ticks*.5).toFixed(1)}s] ${msg}`;$('log').prepend(d);while($('log').children.length>25)$('log').lastChild.remove();}
function toggle(key){let s=tab===1?mixer:reservoir;s[key]=!s[key];addLog(`${key} ${s[key]?'开启':'关闭'}`);render();}
const metric=(name,value)=>`<div class="metric"><small>${name}</small><strong>${value}</strong></div>`;
function render(){const s=tab===1?mixer:reservoir, controls=tab===1?[['pump','水泵'],['valve','阀门 1']]:[['pump','水泵'],['v1','阀门 1 · 灌溉'],['v2','阀门 2 · 混合'],['v3','阀门 3 · 装车']];$('controls').innerHTML=controls.map(([k,n])=>`<button class="control ${s[k]?'active':''}" onclick="toggle('${k}')">${n} ${s[k]?'ON':'OFF'}</button>`).join('')+`<span class="spacer"></span><button class="control" onclick="running=!running;render()">${running?'暂停':'继续'}</button><button class="control" onclick="step()">单步</button><button class="control danger" onclick="reset()">复位</button>`;$('diagram').innerHTML=tab===1?mixerSvg(mixer):reservoirSvg(reservoir);$('metrics').innerHTML=tab===1?metric('液罐水量',s.tank)+metric('蓄水池水量',s.pond)+metric('搅拌机',s.mixer?'运行':'停止'):metric('水库水量',s.level)+metric('反应罐',s.chemical)+metric('累计灌溉',s.grass)+metric('装车水量',s.truck)+metric('小车位置',`${s.position*10}%`);$('requirements').textContent=tab===1?'泵1每周期加水15；阀门1每周期转输10；蓄水池水量达到120自动启动搅拌机。液罐和蓄水池均设150容量保护。':'泵1每周期加20，水库达到120自动停泵；阀门1灌溉、阀门2混合、阀门3装车。装车达到50后关阀，液罐车缓慢右移。';}
function step(){ticks++;const oldMixer=mixer.mixer,oldPump=reservoir.pump,oldLoad=reservoir.truck;M.mixerStep(mixer);M.reservoirStep(reservoir);if(!oldMixer&&mixer.mixer)addLog('蓄水池达到120，搅拌机启动');if(oldPump&&!reservoir.pump)addLog('水库达到120，水泵自动停止');if(oldLoad<50&&reservoir.truck===50)addLog('液罐车满载50，关闭阀门3并驶离');render();}
function reset(){if(tab===1)mixer=M.freshMixer();else reservoir=M.freshReservoir();addLog('系统复位');render();}
$('tab1').onclick=()=>{tab=1;$('tab1').classList.add('selected');$('tab2').classList.remove('selected');render()};$('tab2').onclick=()=>{tab=2;$('tab2').classList.add('selected');$('tab1').classList.remove('selected');render()};addLog('离线仿真启动');render();setInterval(()=>{if(running)step()},500);
</script></body></html>
